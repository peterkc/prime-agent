name: Fork CI

# Fork checks for next. Pi's workflow files stay unchanged.
on:
  pull_request:
    branches: [next]
  push:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Fork PR check
        run: node scripts/fork-pr-check.mjs --base origin/next

      - name: No formatting changes
        run: git diff --exit-code

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        if: matrix.name != 'durable'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Build
        run: npm run build:offline

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Install uv
        if: matrix.name == 'coding-agent'
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            npm run test --workspace "packages/$SUITE"
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/ | packages/durable/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          npm run test:scripts
          npm run test --if-present "${args[@]}"
